server:
  port: ${PORT:8080}
  address: 0.0.0.0
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: erp-hoangminh

  config:
    import: optional:file:.env[.properties],optional:file:./backend/.env[.properties]

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=true&serverTimezone=Asia/Ho_Chi_Minh&useUnicode=true&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      pool-name: erp-hikari

  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  flyway:
    enabled: false

  messages:
    basename: messages_vi
    encoding: UTF-8
    fallback-to-system-locale: false

  web:
    locale: vi_VN
    locale-resolver: fixed

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

erp:
  jwt:
    secret: ${ERP_JWT_SECRET}
    expiration-minutes: 480
    issuer: erp-hoangminh

  upload:
    dir: ${ERP_UPLOAD_DIR:./uploads}

  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173

logging:
  level:
    root: INFO
    vn.hoangminh.erp: INFO
    org.flywaydb: INFO